<style>
:root{
 --bg:#f5f7fb;--card:#fff;--text:#182230;--muted:#667085;--line:#e6eaf0;--primary:#315efb;
 --good:#12b76a;--bad:#f04438;--warn:#f79009;--purple:#7a5af8;--cyan:#06aed4;
 --shadow:0 8px 24px rgba(16,24,40,.06)
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif;color:var(--text)}
.header{background:linear-gradient(135deg,#16213e,#315efb);color:#fff;padding:26px 32px 22px}
.header h1{margin:0;font-size:26px}.header .sub{margin-top:8px;opacity:.86;font-size:14px}
.shell{max-width:1500px;margin:0 auto;padding:22px}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab,.country-btn,.ctrl{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;cursor:pointer;font-size:14px;color:var(--text)}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}.country-btn.active{background:#eef3ff;color:var(--primary);border-color:#b7c6ff;font-weight:600}
.notice{background:#eefbf4;border:1px solid #b8ecd0;color:#087443;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px}.toolbar-actions{display:flex;align-items:center;gap:12px}.updated-at{font-size:12px;font-weight:400;color:#667085;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:14px;margin-bottom:16px}
.kpi,.card{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}
.kpi{padding:18px}.card{padding:16px;margin-bottom:16px}
.kpi .label{font-size:13px;color:var(--muted);margin-bottom:9px}.kpi .value{font-size:26px;font-weight:700}.kpi .hint{margin-top:7px;font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid13{display:grid;grid-template-columns:1.3fr .7fr;gap:16px}
.card h3{font-size:16px;margin:0 0 4px}.desc{font-size:12px;color:var(--muted);margin-bottom:10px}.chart{height:340px;width:100%}
.country-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 6px}.rules{white-space:pre-line;font-size:13px;line-height:1.8;color:#475467}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}th{background:#fafbfc;color:#475467;font-weight:600;position:sticky;top:0}
.page{display:none}.page.active{display:block}.tooltip{position:fixed;pointer-events:none;background:#101828;color:#fff;padding:7px 9px;border-radius:7px;font-size:12px;z-index:99;display:none;box-shadow:0 5px 18px rgba(0,0,0,.25)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#475467;margin:4px 0 8px}.legend span{display:inline-flex;align-items:center;gap:5px}.dot{width:8px;height:8px;border-radius:50%}
.empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
.rankrow{display:grid;grid-template-columns:90px 1fr 80px;gap:8px;align-items:center;margin:11px 0}.rankname{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track{height:10px;background:#eef1f5;border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#315efb,#7a5af8);border-radius:999px}.rankval{font-size:12px;text-align:right;color:#475467}
.heatwrap{overflow:auto;max-height:470px}.heat td{text-align:center;min-width:105px}.heat td:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:1;min-width:150px}.heat th:first-child{left:0;z-index:2}
.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef3ff;color:#315efb;font-size:12px}
@media(max-width:980px){.grid2,.grid13{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.shell{padding:14px}}@media(max-width:560px){.kpis{grid-template-columns:1fr}.header{padding:20px}.chart{height:290px}}
.price-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}.price-grid>.card{margin-bottom:0;min-width:0}.price-grid .chart{height:440px}.price-grid{margin-bottom:16px}@media(max-width:560px){.price-grid .chart{height:360px}}

.price-filters{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:18px 0}.price-filters label{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}.price-filters select{min-width:120px;font-family:inherit}.price-matrix{overflow:auto;max-height:65vh;border:1px solid var(--line);border-radius:9px;margin-top:16px}.price-matrix table{min-width:1260px;font-variant-numeric:tabular-nums}.price-matrix th{white-space:nowrap;z-index:2;padding:14px 12px}.price-matrix td{padding:18px 12px;white-space:nowrap}.price-matrix th:first-child,.price-matrix td:first-child{position:sticky;left:0;background:#fff;z-index:1;min-width:115px;font-weight:600}.price-matrix th:first-child{z-index:3;background:#fafbfc}.price-matrix tbody tr:hover td{background:#f3f6ff}.price-matrix .no-price{color:#98a2b3}.matrix-context{color:var(--primary);font-size:13px;font-weight:600;margin-top:6px}.matrix-note{font-size:12px;color:var(--muted);line-height:1.8;margin-top:14px}.matrix-currency{font-size:11px;color:var(--muted);font-weight:400;display:block;margin-top:4px}.matrix-foot{padding-top:14px;border-top:1px solid var(--line);margin-top:16px}
</style></head>

   }
   let tx=document.createElementNS(svg.namespaceURI,"text");tx.setAttribute("x",p.l+mi*groupW+groupW/2);tx.setAttribute("y",H-17);tx.setAttribute("text-anchor","middle");tx.setAttribute("font-size","11");tx.setAttribute("fill","#667085");tx.textContent=m;svg.appendChild(tx)
 });
 el.appendChild(svg);legend(el,series)
}
function lineChart(el, series, months){
 clearLegend(el);el.innerHTML="";
 let vals=[];series.forEach(s=>s.values.forEach(v=>{if(v!=null&&isFinite(v))vals.push(v)}));if(!vals.length){el.innerHTML='<div class="empty">暂无数据</div>';return}
 const W=Math.max(el.clientWidth||720,380),H=el.clientHeight||340,p={l:78,r:18,t:24,b:48},iw=W-p.l-p.r,ih=H-p.t-p.b;
 let rawMin=Math.min(...vals),rawMax=Math.max(...vals),span=rawMax-rawMin;
 // 动态Y轴：围绕实际数据上下留白，放大小幅变化；全相等时给±5%窗口
 let padVal=span>0 ? span*0.18 : Math.max(Math.abs(rawMax)*0.05,0.000001);
 let min=rawMin-padVal,max=rawMax+padVal;
 if(min<0 && rawMin>=0) min=0;
 if(max===min) max=min+1;
 const x=i=>p.l+(months.length===1?iw/2:i*iw/(months.length-1)),y=v=>p.t+ih-(v-min)/(max-min)*ih;
 const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");svg.setAttribute("width","100%");svg.setAttribute("height","100%");svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
 for(let i=0;i<=4;i++){const yy=p.t+ih*i/4,val=max-(max-min)*i/4;let ln=document.createElementNS(svg.namespaceURI,"line");ln.setAttribute("x1",p.l);ln.setAttribute("x2",W-p.r);ln.setAttribute("y1",yy);ln.setAttribute("y2",yy);ln.setAttribute("stroke","#edf0f4");svg.appendChild(ln);let tx=document.createElementNS(svg.namespaceURI,"text");tx.setAttribute("x",p.l-8);tx.setAttribute("y",yy+4);tx.setAttribute("text-anchor","end");tx.setAttribute("font-size","11");tx.setAttribute("fill","#98a2b3");tx.textContent=fmtPrice(val);svg.appendChild(tx)}
 months.forEach((m,i)=>{let tx=document.createElementNS(svg.namespaceURI,"text");tx.setAttribute("x",x(i));tx.setAttribute("y",H-17);tx.setAttribute("text-anchor","middle");tx.setAttribute("font-size","11");tx.setAttribute("fill","#667085");tx.textContent=m;svg.appendChild(tx)});
 series.forEach((s,si)=>{const pts=[];s.values.forEach((v,i)=>{if(v!=null&&isFinite(v))pts.push([x(i),y(v),v,i])});if(!pts.length)return;let path=document.createElementNS(svg.namespaceURI,"path");path.setAttribute("d",pts.map((q,j)=>(j&&q[3]===pts[j-1][3]+1?"L":"M")+q[0]+" "+q[1]).join(" "));path.setAttribute("fill","none");path.setAttribute("stroke",(s.color||COLORS[si%COLORS.length]));path.setAttribute("stroke-width","2.8");svg.appendChild(path);pts.forEach(q=>{let c=document.createElementNS(svg.namespaceURI,"circle");c.setAttribute("cx",q[0]);c.setAttribute("cy",q[1]);c.setAttribute("r","4.5");c.setAttribute("fill","#fff");c.setAttribute("stroke",(s.color||COLORS[si%COLORS.length]));c.setAttribute("stroke-width","2");c.addEventListener("mousemove",e=>showTip(e,`${s.name}<br>${months[q[3]]}：${fmtPrice(q[2])}`));c.addEventListener("mouseleave",hideTip);svg.appendChild(c);
   // 均价点标签
   const lb=document.createElementNS(svg.namespaceURI,"text");lb.setAttribute("x",q[0]);lb.setAttribute("y",Math.max(q[1]-9,12));lb.setAttribute("text-anchor","middle");lb.setAttribute("font-size","10.5");lb.setAttribute("font-weight","600");lb.setAttribute("fill","#475467");lb.textContent=fmtPrice(q[2]);svg.appendChild(lb)
 })});
 el.appendChild(svg);legend(el,series)
}
function makeSeries(rows,dim,metric){const g=group(rows,["month",dim]),names=dim==="country"?REPORT.countries.filter(c=>g.some(x=>x.key[1]===c)):[...new Set(g.map(x=>x.key[1]))];return names.map(name=>({name,color:dim==="country"?COUNTRY_COLORS[name]:null,values:REPORT.months.map(m=>{const x=g.find(z=>z.key[0]===m&&z.key[1]===name);if(!x)return null;return metric==="cost"?x.cost:(x.price_qty?x.price_cost/x.price_qty:null)})}))}
function oneSeries(rows,name,metric){const g=group(rows,["month"]);return[{name,values:REPORT.months.map(m=>{const x=g.find(z=>z.key[0]===m);if(!x)return null;return metric==="cost"?x.cost:(x.price_qty?x.price_cost/x.price_qty:null)})}]}
function rankBars(el,rows,key){const latest=REPORT.months.at(-1),g=group(rows.filter(r=>r.month===latest),[key]).sort((a,b)=>b.cost-a.cost),mx=Math.max(...g.map(x=>x.cost),1);el.innerHTML=g.map(x=>`<div class="rankrow"><div class="rankname" title="${x.key[0]}">${x.key[0]}</div><div class="track"><div class="fill" style="width:${x.cost/mx*100}%"></div></div><div class="rankval">${fmtMoney(x.cost)}</div></div>`).join("")||'<div class="empty" style="height:150px">暂无数据</div>'}
function heatTable(el,rows){
 const gs=group(rows,["supplier","month"]);
 const latestMonth=REPORT.months.slice().reverse().find(m=>gs.some(x=>x.key[1]===m&&x.price_qty));
 const supplierPrice=new Map();
 [...new Set(gs.map(x=>x.key[0]))].forEach(s=>{
   let x=latestMonth?gs.find(z=>z.key[0]===s&&z.key[1]===latestMonth&&z.price_qty):null;
   if(!x){
     const hist=gs.filter(z=>z.key[0]===s&&z.price_qty).sort((a,b)=>b.key[1].localeCompare(a.key[1]));
     x=hist[0]||null;
   }
   supplierPrice.set(s,x&&x.price_qty?x.price_cost/x.price_qty:null);
 });
 const sups=[...supplierPrice.keys()].sort((a,b)=>{
   const pa=supplierPrice.get(a),pb=supplierPrice.get(b);
   if(pa==null&&pb==null)return a.localeCompare(b,"zh-CN");
   if(pa==null)return 1;
   if(pb==null)return -1;
   if(pa!==pb)return pa-pb;
   return a.localeCompare(b,"zh-CN");
 });
 let vals=gs.filter(x=>x.price_qty).map(x=>x.price_cost/x.price_qty),mn=Math.min(...vals),mx=Math.max(...vals);
 const color=v=>{if(v==null||!isFinite(v))return"transparent";let t=mx===mn?.5:(v-mn)/(mx-mn);return`rgba(49,94,251,${0.08+0.48*t})`};
 el.innerHTML=`<div class="heatwrap"><table class="heat"><thead><tr><th>供应商</th>${REPORT.months.map(m=>`<th>${m}</th>`).join("")}</tr></thead><tbody>`+
 sups.map(s=>`<tr><td>${s}</td>${REPORT.months.map(m=>{const x=gs.find(z=>z.key[0]===s&&z.key[1]===m),v=x&&x.price_qty?x.price_cost/x.price_qty:null;return`<td style="background:${color(v)}">${fmtPrice(v)}</td>`}).join("")}</tr>`).join("")+`</tbody></table></div>`
}
function build(){
 document.getElementById("reportPeriod").textContent=REPORT.months[0]+" 至 "+REPORT.months.at(-1)+" · 六国通讯成本与工具均价";
 document.getElementById("mainTabs").innerHTML=`<button class="tab active" data-page="summary">汇总</button><button class="tab" data-page="prices">各工具均价</button>`+REPORT.pages.map(p=>`<button class="tab" data-page="${p.id}">${p.label}</button>`).join("");
 document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>switchPage(b.dataset.page));
 let pages=`<section class="page active" id="page-summary"><div class="kpis" id="kpis"></div><div class="grid2"><div class="card"><h3>分渠道月度成本趋势</h3><div class="desc">堆叠柱状图 · 展示每月各渠道成本构成</div><div class="chart" id="sumChannel"></div></div><div class="card"><h3>分国家月度成本趋势</h3><div class="desc">堆叠柱状图 · 展示每月各国成本构成</div><div class="chart" id="sumCountry"></div></div></div><div class="grid2"><div class="card"><h3>最新月渠道成本排名</h3><div id="rankChannel"></div></div><div class="card"><h3>最新月国家成本排名</h3><div id="rankCountry"></div></div></div></section>`;
 REPORT.pages.forEach(p=>{let price=p.showPrice;pages+=`<section class="page" id="page-${p.id}"><div class="card"><h3>${p.label} · 国家选择</h3><div class="country-tabs" id="countries-${p.id}"></div></div><div class="grid13"><div class="card"><h3>分月成本趋势</h3><div class="desc">柱状图更适合观察月度金额绝对变化</div><div class="chart" id="cost-${p.id}"></div></div><div class="card"><h3>最新月供应商成本排名</h3><div id="rank-${p.id}"></div></div></div>`+(price?`<div class="price-grid"><div class="card"><h3>分月整体均价</h3><div class="desc" id="price-note-${p.id}">均价=有效记录含税成本÷对应标准消耗量；用量缺失或为0的成本不参与单价计算。缺失月份断开连线；均价变化也受供应商用量结构影响。</div><div class="chart" id="avg-${p.id}"></div></div><div class="card"><h3>各供应商分月单价</h3><div class="desc">热力表：按最新可用单价升序排列，颜色越深，单价越高</div><div id="heat-${p.id}"></div></div></div>`:`<div class="card"><h3>单价</h3><div class="empty" style="height:100px">此服务资源类型不展示单价</div></div>`)+`</section>`});
 pages+=`<section class="page" id="page-prices"><div class="card"><h3>各工具均价</h3><div class="desc">按国家横向对比各工具的加权均价</div><div class="price-filters"><label for="priceMonth">月份<select id="priceMonth" class="ctrl" onchange="priceMonth=this.value;renderPriceMatrix()">${REPORT.months.slice().reverse().map(m=>`<option value="${m}">${m}${m===REPORT.months.at(-1)?'（全月预估）':''}</option>`).join('')}<option value="all">全部月份</option></select></label><label for="priceCurrency">展示币种<select id="priceCurrency" class="ctrl" onchange="priceCurrency=this.value;renderPriceMatrix()"><option value="CNY">CNY（人民币）</option><option value="USD">USD（美元）</option><option value="local">本币</option></select></label></div><div id="matrixContext" class="matrix-context"></div><div id="priceMatrix" class="price-matrix"></div><div class="matrix-note">均价 = 有效记录含税成本合计 ÷ 对应预估全月标准消耗量，按用量加权。币种转换逐条使用对应月份汇率；本币为各国当地货币。<br>分母沿用数据源的“标准消耗量”，不使用原始计费用量；不同工具的标准量定义可能不同。用量缺失或为0的记录不参与均价，保留在成本统计中。<br>“—”表示无有效用量或该工具不展示单价；傲途、服务器沿用原看板规则不展示单价。</div><div id="matrixFoot" class="matrix-note matrix-foot"></div></div></section>`;
 document.getElementById("pages").innerHTML=pages;document.getElementById("rulesText").textContent=REPORT.rules;document.getElementById("updatedAt").textContent="数据更新时间："+REPORT.updatedAt;
 const fxt={};REPORT.fx.forEach(x=>{fxt[x.currency]=fxt[x.currency]||{};fxt[x.currency][x.month]=x.rate});document.getElementById("fxTable").innerHTML=`<table><thead><tr><th>币种</th>${REPORT.months.map(m=>`<th>${m}</th>`).join("")}</tr></thead><tbody>`+Object.keys(fxt).map(c=>`<tr><td>${c}</td>${REPORT.months.map(m=>`<td>${fxt[c][m].toFixed(c==="IDR"?9:6)}</td>`).join("")}</tr>`).join("")+`</tbody></table>`;
 REPORT.pages.forEach(p=>{const cs=[...new Set(REPORT.data.filter(r=>r.page===p.id).map(r=>r.country))].sort(),opts=cs.length>1?["全部",...cs]:cs;currentCountry[p.id]=opts[0];const box=document.getElementById(`countries-${p.id}`);box.innerHTML=opts.map((c,i)=>`<button class="country-btn ${i===0?"active":""}" data-country="${c}">${c}</button>`).join("");box.querySelectorAll("button").forEach(b=>b.onclick=()=>{currentCountry[p.id]=b.dataset.country;box.querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));renderChannel(p.id)})});renderAll()}
function renderSummary(){const rows=rowsFiltered(),latest=REPORT.months.at(-1),prev=REPORT.months.at(-2),total=sum(rows.map(r=>r.cost)),lc=sum(rows.filter(r=>r.month===latest).map(r=>r.cost)),pc=sum(rows.filter(r=>r.month===prev).map(r=>r.cost)),mom=pc?(lc-pc)/pc:null;document.getElementById("kpis").innerHTML=`<div class="kpi"><div class="label">期间总成本</div><div class="value">${fmtMoney(total)}</div><div class="hint">${REPORT.months[0]} ~ ${latest}</div></div><div class="kpi"><div class="label">${latest} 成本</div><div class="value">${fmtMoney(lc)}</div><div class="hint">统一CNY口径</div></div><div class="kpi"><div class="label">最新月环比</div><div class="value" style="color:${mom==null?"#182230":mom>=0?"#f04438":"#12b76a"}">${mom==null?"-":(mom*100).toFixed(1)+"%"}</div><div class="hint">对比 ${prev}</div></div><div class="kpi"><div class="label">覆盖范围</div><div class="value">${new Set(rows.map(r=>r.country)).size} 国 / ${new Set(rows.map(r=>r.channel)).size} 渠道</div><div class="hint">成本均已折算为人民币，IVR并入AI</div></div>`;barChart(document.getElementById("sumChannel"),makeSeries(rows,"channel","cost"),REPORT.months,true);barChart(document.getElementById("sumCountry"),makeSeries(rows,"country","cost"),REPORT.months,true);rankBars(document.getElementById("rankChannel"),rows,"channel");rankBars(document.getElementById("rankCountry"),rows,"country")}
function renderChannel(id){const p=REPORT.pages.find(x=>x.id===id),country=currentCountry[id],all=country==="全部",rows=rowsFiltered({page:id,country:all?null:country});const cost=all?oneSeries(rows,"全部国家","cost"):makeSeries(rows,"supplier","cost");if(all)cost[0].color="#344054";barChart(document.getElementById(`cost-${id}`),cost,REPORT.months,!all);rankBars(document.getElementById(`rank-${id}`),rows,"supplier");if(p.showPrice){const omitted=rows.filter(r=>r.cost!==0&&(r.qty<=0||r.qty_missing));document.getElementById(`price-note-${id}`).textContent="均价=有效记录含税成本÷对应标准消耗量；缺失月份断开连线。供应商用量结构变化也会影响均价。"+(omitted.length?` 当前选择中，${omitted.length}条记录因用量缺失或为0，仅计入成本、不参与单价计算。`:"");const price=oneSeries(rows,"整体均价","price");price[0].color=all?"#344054":COUNTRY_COLORS[country];lineChart(document.getElementById(`avg-${id}`),price,REPORT.months);heatTable(document.getElementById(`heat-${id}`),rows)}}

function fxRate(month,currency){if(currency==="CNY")return 1;const fx=REPORT.fx.find(r=>r.month===month&&r.currency===currency);if(!fx||!(fx.rate>0))throw new Error(`缺少汇率：${month} ${currency}`);return fx.rate}
function toolPrice(country,page,month=priceMonth,currency=priceCurrency){
 const target=currency==="local"?REPORT.localCurrencies[country]:currency;
 const all=REPORT.data.filter(r=>r.country===country&&r.page===page&&(month==="all"||r.month===month));
 const valid=all.filter(r=>r.show_price&&r.qty>0&&!r.qty_missing&&Number.isFinite(r.cost));
 const qty=sum(valid.map(r=>r.qty));
 return {value:qty?sum(valid.map(r=>r.cost/fxRate(r.month,target)))/qty:null,currency:target,qty,omitted:all.filter(r=>r.show_price&&(r.qty<=0||r.qty_missing)).length};
}
function matrixNumber(value){if(value==null||!Number.isFinite(value))return '—';return value.toLocaleString('zh-CN',{minimumFractionDigits:4,maximumFractionDigits:4})}
function renderPriceMatrix(){
 const monthLabel=priceMonth==="all"?`${REPORT.months[0]} 至 ${REPORT.months.at(-1)}（全部月份）`:priceMonth+(priceMonth===REPORT.months.at(-1)?'（全月预估）':'');
 document.getElementById('matrixContext').textContent=monthLabel+' · '+(priceCurrency==='local'?'本币（各国当地货币）':priceCurrency)+' / 标准量';
 let omitted=0;
 document.getElementById('priceMatrix').innerHTML='<table aria-label="各国家各工具均价表"><thead><tr><th scope="col">国家 / 币种</th>'+REPORT.pages.map(p=>`<th scope="col">${p.label}</th>`).join('')+'</tr></thead><tbody>'+REPORT.countries.map(c=>`<tr><td>${c}<span class="matrix-currency">${priceCurrency==='local'?REPORT.localCurrencies[c]:priceCurrency} / 标准量</span></td>`+REPORT.pages.map(p=>{const x=toolPrice(c,p.id);omitted+=x.omitted;return `<td class="${x.value==null?'no-price':''}" title="${p.label} · ${x.currency} / 标准量${x.value==null?' · 无有效均价':` · 标准消耗量 ${x.qty.toLocaleString('zh-CN')}`}" >${matrixNumber(x.value)}${x.value!=null&&p.id==="线路"?(c==="印尼"?"（每秒）":"（每分钟）"):""}</td>`}).join('')+'</tr>').join('')+'</tbody></table>';
 document.getElementById('matrixFoot').textContent=`源数据：${REPORT.sourceFile}。当前月份范围有 ${omitted} 条记录因用量缺失或为0不参与均价。汇率沿用2026-10-09快照，可在“口径与汇率”查看。`;
}
function renderCurrent(){if(currentPage==='summary')renderSummary();else if(currentPage==='prices')renderPriceMatrix();else renderChannel(currentPage)}

function switchPage(p){currentPage=p;document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.page===p));document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(p==="summary"?"page-summary":`page-${p}`).classList.add("active");setTimeout(renderCurrent,30)}
function toggleRules(){const x=document.getElementById("rulesCard");x.style.display=x.style.display==="none"?"block":"none"}
function renderAll(){renderSummary();renderPriceMatrix();REPORT.pages.forEach(p=>renderChannel(p.id))}
build();window.addEventListener("resize",()=>{clearTimeout(window.__r);window.__r=setTimeout(renderCurrent,150)})
</script></body></html>
